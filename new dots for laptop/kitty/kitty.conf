# ~/.config/kitty/kitty.conf
# ---------------------------------------------------------------------------
# Matches the quickshell Bar.qml / rofi.rasi theme: soft dark base, muted
# blue-grey text, one accent colour (blue) plus the same seven accent swatch
# colours offered in the bar's Customize popup, mapped onto the 16 ANSI
# slots. Change ACCENT below (and its "bright" pair) to flip the whole
# terminal's accent the same way accentColor does in Bar.qml — the rest of
# the palette is shared with the bar/rofi so all three stay in sync.
#
#   BG          #1e1e2e   SURFACE     #262838   SURFACE2   #33344a
#   TEXT        #cad3f5   MUTED       #6e738d   ACCENT     #8aadf4 (blue)
#
# This file also wires up splits/layouts, tab & window keybindings, hints
# (open urls/paths/hashes with the keyboard), a scrollback pager, unicode
# input, remote control, and a couple of small conveniences (quick font
# size, clear-and-reset, broadcast typing to all panes in a tab).
# ---------------------------------------------------------------------------

# =====================================================================
# FONTS
# =====================================================================
font_family      family="JetBrainsMono Nerd Font" style="Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
adjust_line_height  110%
adjust_column_width 0
disable_ligatures  never
box_drawing_scale 0.001, 1, 1.5, 2

# live font-size tweaks without touching the config
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# =====================================================================
# CURSOR / SCROLLBACK / MOUSE
# =====================================================================
cursor                 #8aadf4
cursor_text_color      #1e1e2e
cursor_shape           beam
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 128
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

mouse_hide_wait       3.0
url_color             #8aadf4
url_style              curly
open_url_with          default
copy_on_select         yes
strip_trailing_spaces  smart
select_by_word_characters @-./_~?&=%+#

# right-click pastes primary selection, like most terminal emulators
mouse_map right press ungrabbed paste_from_selection

# =====================================================================
# WINDOW LAYOUT
# =====================================================================
remember_window_size   yes
initial_window_width   980
initial_window_height  620
window_padding_width    12
hide_window_decorations titlebar-only
placement_strategy      center
confirm_os_window_close 0
resize_debounce_time    0.1
resize_draw_strategy    gradual

# window borders (visible with >1 split) — echoes the bar's border colour
active_border_color     #8aadf4
inactive_border_color   #33344a
bell_border_color       #ed8796
window_margin_width     2
single_window_margin_width 0
window_border_width     1pt
draw_minimal_borders    yes
inactive_text_alpha     0.85

# =====================================================================
# LAYOUTS & SPLITS
# ---------------------------------------------------------------------
# enable a real set of layouts and bind vim-style keys to create,
# navigate, resize and swap panes instead of only ever opening tabs.
# =====================================================================
enabled_layouts   splits, stack, tall, fat, grid
layout_name       splits

map ctrl+shift+enter   launch --cwd=current --location=hsplit
map ctrl+shift+d       launch --cwd=current --location=vsplit
map ctrl+shift+z       toggle_layout stack

# move focus between panes (vim-style + arrows)
map ctrl+shift+h       neighboring_window left
map ctrl+shift+l       neighboring_window right
map ctrl+shift+k       neighboring_window up
map ctrl+shift+j       neighboring_window down

# swap the focused pane with a neighbour
map ctrl+shift+alt+h   move_window left
map ctrl+shift+alt+l   move_window right
map ctrl+shift+alt+k   move_window up
map ctrl+shift+alt+j   move_window down

# resize mode: press the combo, then use hjkl / arrows, esc/enter to exit
map ctrl+shift+r       start_resizing_window

map ctrl+shift+f       toggle_fullscreen
map ctrl+shift+q       close_window

# =====================================================================
# TABS
# =====================================================================
tab_bar_edge                bottom
tab_bar_style                powerline
tab_powerline_style          slanted
tab_bar_margin_width         0
tab_bar_min_tabs             2
tab_title_template           "{index}: {title}"
active_tab_foreground        #1e1e2e
active_tab_background        #8aadf4
active_tab_font_style        bold
inactive_tab_foreground      #6e738d
inactive_tab_background      #262838
inactive_tab_font_style      normal

map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+w       close_tab
map ctrl+shift+right   next_tab
map ctrl+shift+left    previous_tab
map ctrl+shift+.       move_tab_forward
map ctrl+shift+,       move_tab_backward
map ctrl+shift+alt+t   set_tab_title
# jump straight to tab 1-9
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# =====================================================================
# HINTS, CLIPBOARD & UNICODE INPUT
# ---------------------------------------------------------------------
# keyboard-driven selection of urls / paths / hashes on screen, plus a
# proper unicode input picker instead of relying on the shell for it.
# =====================================================================
map ctrl+shift+e         open_url_with_hints
map ctrl+shift+p>f       kitten hints --type path --program -
map ctrl+shift+p>shift+f kitten hints --type path
map ctrl+shift+p>l       kitten hints --type line --program -
map ctrl+shift+p>w       kitten hints --type word --program -
map ctrl+shift+p>h       kitten hints --type hash --program -
map ctrl+shift+u         kitten unicode_input
map ctrl+shift+v         paste_from_clipboard
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+s         paste_from_selection

# =====================================================================
# BROADCASTING / MULTIPLEXING NICETIES
# ---------------------------------------------------------------------
# type into every pane in the current tab at once — handy for running
# the same command across several splits (e.g. updating multiple hosts).
# =====================================================================
map ctrl+shift+x         kitten broadcast

# =====================================================================
# MISC BEHAVIOUR
# =====================================================================
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes
command_on_bell          none
update_check_interval   0
shell_integration       enabled
allow_remote_control     socket-only
listen_on                unix:/tmp/kitty-{kitty_pid}
allow_hyperlinks         yes
notify_on_cmd_finish     invisible 5.0
confirm_os_window_close  0
clipboard_control        write-clipboard write-primary read-clipboard-ask read-primary-ask
editor                   .

map ctrl+shift+delete  clear_terminal reset active
map ctrl+shift+f5      load_config_file
map ctrl+shift+f6      debug_config

# =====================================================================
# COLOUR SCHEME — kept in sync with Bar.qml's palette + accent swatches
# =====================================================================

foreground              #cad3f5
background               #1e1e2e
background_opacity      0.92
dynamic_background_opacity yes

selection_foreground    #1e1e2e
selection_background    #8aadf4

# ---- 16 ANSI colours ----
# black
color0  #33344a
color8  #6e738d
# red
color1  #ed8796
color9  #ec7486
# green
color2  #a6da95
color10 #8ccf7e
# yellow
color3  #eed49f
color11 #e1c682
# blue (ACCENT)
color4  #8aadf4
color12 #78a1f6
# magenta / mauve
color5  #c6a0f6
color13 #c09af5
# cyan / teal
color6  #8bd5ca
color14 #63cbc0
# white
color7  #cad3f5
color15 #ffffff

# extra accents available for prompts/plugins (mirrors the bar's swatch row)
# peach #f5a97f   pink #f5bde6   surface #262838   surface2 #33344a

# ---- marks (kitty --hold / kitten hints etc.) ----
mark1_foreground #1e1e2e
mark1_background #8aadf4
mark2_foreground #1e1e2e
mark2_background #a6da95
mark3_foreground #1e1e2e
mark3_background #f5a97f
